<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>捉鬼师论坛 · 非官方同人演示论坛</title>
<style>
  :root{
    --bg:#0c0c0e; --bg2:#111114; --card:#17171b; --card2:#1d1d22;
    --line:#2b2b31; --line2:#3a3a42; --text:#e9e9ee; --muted:#9a9aa4;
    --dim:#6d6d76; --white:#fff; --accent:#d7d7e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 70% -10%, #1a1a1f 0%, transparent 60%),
      radial-gradient(900px 500px at 10% 0%, #151519 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  img{max-width:100%}

  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(12,12,14,.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1160px; margin:0 auto; padding:0 18px;
    height:58px; display:flex; align-items:center; gap:18px;
  }
  .logo{display:flex; align-items:baseline; gap:9px; white-space:nowrap}
  .logo b{font-size:18px; letter-spacing:2px; color:var(--white); font-weight:700}
  .logo span{font-size:10px; color:var(--dim); letter-spacing:1px}
  .nav{display:flex; gap:2px; flex:1; overflow-x:auto}
  .nav a{
    padding:7px 11px; border-radius:7px; color:var(--muted);
    font-size:13px; white-space:nowrap; border:1px solid transparent;
  }
  .nav a:hover{color:var(--white); background:var(--card)}
  .nav a.on{color:var(--white); background:var(--card2); border-color:var(--line)}
  .top-actions{display:flex; align-items:center; gap:8px}
  .search-mini{
    display:flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:5px 9px;
  }
  .search-mini input{
    background:transparent; border:0; outline:0; color:var(--text);
    width:120px; font-size:12px;
  }
  .icon-btn{
    background:var(--card); border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:7px 10px; font-size:12px; position:relative;
  }
  .icon-btn:hover{color:var(--white); border-color:var(--line2)}
  .badge{
    position:absolute; top:-5px; right:-5px; background:var(--white); color:#111;
    border-radius:99px; font-size:10px; padding:0 5px; font-weight:700;
  }
  .btn{
    background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 13px; font-size:13px;
  }
  .btn:hover{background:var(--card2); border-color:var(--line2)}
  .btn.primary{background:var(--white); color:#111; border-color:var(--white); font-weight:600}
  .btn.primary:hover{background:#e6e6ea}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 9px; font-size:12px; border-radius:7px}

  .wrap{max-width:1160px; margin:0 auto; padding:20px 18px 60px}
  .layout{display:grid; grid-template-columns:1fr 290px; gap:18px; align-items:start}
  @media(max-width:900px){ .layout{grid-template-columns:1fr} .side{display:none} }
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px}
  .card-pad{padding:16px}
  .section-title{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .section-title h3{margin:0; font-size:14px; letter-spacing:1px; color:var(--accent)}
  .section-title .more{font-size:12px; color:var(--dim)}
  .section-title .more:hover{color:var(--white)}

  .notice{
    display:flex; gap:10px; align-items:flex-start;
    background:linear-gradient(180deg,#1a1a1f,#151518);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:16px;
  }
  .notice .tag{
    flex:none; font-size:11px; border:1px solid var(--line2); color:var(--accent);
    border-radius:5px; padding:1px 6px; margin-top:2px;
  }
  .notice p{margin:0; color:var(--muted); font-size:12.5px}
  .notice b{color:var(--text)}

  .post-list{display:flex; flex-direction:column}
  .post-row{
    display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line);
    cursor:pointer; transition:background .15s;
  }
  .post-row:last-child{border-bottom:0}
  .post-row:hover{background:var(--card2)}
  .avatar{
    width:40px; height:40px; border-radius:10px; object-fit:cover; flex:none;
    background:#232328; border:1px solid var(--line2);
  }
  .avatar.sm{width:32px; height:32px; border-radius:9px}
  .post-main{min-width:0; flex:1}
  .post-title{
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    font-size:14.5px; color:var(--text); font-weight:600;
  }
  .post-title .pin{font-size:10px; color:#111; background:var(--accent); border-radius:4px; padding:0 5px; font-weight:700}
  .post-meta{
    display:flex; gap:10px; flex-wrap:wrap; color:var(--dim);
    font-size:11.5px; margin-top:5px;
  }
  .post-meta .who{color:var(--muted)}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
  .tag-pill{
    font-size:11px; color:var(--muted); border:1px solid var(--line);
    border-radius:99px; padding:1px 8px; background:var(--bg2);
  }
  .tag-pill.role{color:var(--accent); border-color:var(--line2)}
  .post-stats{
    flex:none; display:flex; flex-direction:column; align-items:flex-end;
    gap:6px; color:var(--dim); font-size:11.5px; min-width:64px;
  }
  .post-stats b{color:var(--muted); font-weight:600}

  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px}
  .board-card{
    background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:13px; cursor:pointer; transition:.15s;
  }
  .board-card:hover{border-color:var(--line2); background:var(--card2); transform:translateY(-1px)}
  .board-card b{display:block; color:var(--text); font-size:13.5px}
  .board-card small{color:var(--dim); font-size:11.5px; display:block; margin-top:4px}
  .char-card{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:11px; padding:11px; cursor:pointer;
  }
  .char-card:hover{border-color:var(--line2); background:var(--card2)}
  .char-card .name{font-size:13px; color:var(--text); font-weight:600}
  .char-card .role{font-size:11px; color:var(--dim)}

  .post-head{padding:18px 18px 14px; border-bottom:1px solid var(--line)}
  .post-head h1{margin:0 0 10px; font-size:20px; line-height:1.4; color:var(--white)}
  .floor{
    display:flex; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line);
  }
  .floor:last-child{border-bottom:0}
  .floor .side-user{width:92px; flex:none; text-align:center}
  .floor .side-user .name{font-size:12.5px; color:var(--text); margin-top:6px; word-break:break-all}
  .floor .side-user .role-tag{font-size:10px; color:var(--dim); margin-top:2px}
  .floor .content{flex:1; min-width:0}
  .floor .content .topline{
    display:flex; justify-content:space-between; gap:8px; color:var(--dim);
    font-size:11px; margin-bottom:8px;
  }
  .floor .content .text{white-space:pre-wrap; color:var(--text); font-size:14px}
  .floor .content .text p{margin:0 0 8px}
  .floor-actions{display:flex; gap:12px; margin-top:10px; color:var(--dim); font-size:11.5px}
  .floor-actions button{background:none; border:0; color:var(--dim); padding:0; font-size:11.5px}
  .floor-actions button:hover{color:var(--white)}
  .floor-actions .liked{color:var(--white)}

  .post-image{
    margin:10px 0 0; border:1px solid var(--line); border-radius:10px;
    overflow:hidden; background:#141417; position:relative; min-height:80px;
    display:flex; align-items:center; justify-content:center;
  }
  .post-image img{display:block; width:100%; height:auto}
  .post-image .img-note{display:none; color:var(--dim); font-size:12px; padding:28px 10px}
  .post-image.missing .img-note{display:block}
  .post-image.missing img{display:none}

  .collapsed-reply{
    border:1px dashed var(--line2); border-radius:9px; padding:11px 13px;
    color:var(--dim); font-size:12.5px; background:var(--bg2);
  }
  .collapsed-reply button{margin-left:8px}
  .violation-tag{
    display:inline-block; font-size:10px; color:var(--muted);
    border:1px solid var(--line2); border-radius:4px; padding:0 5px; margin-right:6px;
  }

  .reply-box{padding:16px 18px}
  .reply-box textarea{
    width:100%; min-height:90px; resize:vertical; background:var(--bg2);
    border:1px solid var(--line); border-radius:9px; color:var(--text);
    padding:10px 12px; outline:0; font-family:inherit; font-size:13.5px;
  }
  .reply-box textarea:focus{border-color:var(--line2)}
  .reply-box .row{display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px}
  .hint{color:var(--dim); font-size:11.5px}

  .side .card{margin-bottom:14px}
  .side-list{padding:6px 16px 12px}
  .side-item{padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px}
  .side-item:last-child{border-bottom:0}
  .side-item .t{color:var(--text); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .side-item .m{color:var(--dim); font-size:11px; margin-top:2px}
  .online-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:middle}

  .modal-mask{
    position:fixed; inset:0; background:rgba(0,0,0,.66); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal{
    width:100%; max-width:390px; background:var(--card); border:1px solid var(--line2);
    border-radius:14px; padding:20px;
  }
  .modal h2{margin:0 0 4px; font-size:17px; color:var(--white)}
  .modal p.sub{margin:0 0 16px; color:var(--dim); font-size:12px}
  .field{margin-bottom:11px}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px}
  .field input{
    width:100%; background:var(--bg2); border:1px solid var(--line);
    border-radius:8px; padding:9px 11px; color:var(--text); outline:0; font-size:13px;
  }
  .field input:focus{border-color:var(--line2)}
  .modal .row{display:flex; gap:8px; margin-top:14px}
  .modal .row .btn{flex:1}
  .modal .swap{text-align:center; margin-top:12px; font-size:12px; color:var(--dim)}
  .modal .swap button{background:none; border:0; color:var(--accent); font-size:12px; padding:0}
  .form-error{color:#d9a0a0; font-size:11.5px; margin-top:8px; min-height:16px}
  .demo-tip{
    margin-top:12px; padding:9px 11px; border:1px dashed var(--line2);
    border-radius:8px; color:var(--dim); font-size:11.5px; line-height:1.7;
  }

  .user-chip{display:flex; align-items:center; gap:8px; cursor:pointer}
  .user-chip .name{font-size:12.5px; color:var(--text); max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .empty{padding:34px 18px; text-align:center; color:var(--dim); font-size:13px}

  .footer{
    max-width:1160px; margin:0 auto; padding:26px 18px 40px;
    border-top:1px solid var(--line); color:var(--dim); font-size:11.5px; line-height:1.9;
  }
  .footer b{color:var(--muted)}
  .footer .reset{color:var(--dim); text-decoration:underline; background:none; border:0; font-size:11.5px; padding:0}

  .notif-item{display:flex; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line)}
  .notif-item:last-child{border-bottom:0}
  .notif-item.unread{background:var(--card2)}
  .notif-item .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:8px; flex:none}
  .notif-item .txt{font-size:12.5px; color:var(--text)}
  .notif-item .tm{font-size:11px; color:var(--dim); margin-top:3px}

  .profile-head{display:flex; gap:14px; align-items:center; padding:18px}
  .profile-head .avatar{width:56px; height:56px; border-radius:14px}
  .stat-row{display:flex; gap:18px; margin-top:6px; color:var(--dim); font-size:12px}
  .stat-row b{color:var(--text)}

  .tabs{display:flex; gap:6px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .tabs button{
    background:var(--bg2); border:1px solid var(--line); color:var(--muted);
    border-radius:99px; padding:5px 12px; font-size:12px;
  }
  .tabs button.on{background:var(--white); color:#111; border-color:var(--white); font-weight:600}

  .breadcrumb{color:var(--dim); font-size:12px; margin-bottom:12px}
  .breadcrumb span{cursor:pointer}
  .breadcrumb span:hover{color:var(--white)}

  @media(max-width:600px){
    .topbar-inner{height:auto; padding:10px 12px; flex-wrap:wrap; gap:10px}
    .nav{order:3; width:100%; flex:1 1 100%}
    .search-mini input{width:80px}
    .post-stats{display:none}
    .floor .side-user{width:64px}
    .floor .side-user .avatar{width:36px; height:36px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="footer" id="footer"></div>

<script>
const DEFAULT_NPC_AVATAR = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
    <rect width="80" height="80" fill="#232328"/>
    <circle cx="40" cy="30" r="13" fill="#6d6d76"/>
    <path d="M15 73c2-17 13-25 25-25s23 8 25 25" fill="#6d6d76"/>
  </svg>`
);

const CHARACTERS = {
  luo:  { name:"双面鬼", avatar:"assets/avatars/characters/luo-yunying-avatar.png", title:"嘴毒心软" },
  qin:  { name:"秦大侠", avatar:"assets/avatars/characters/qin-wu-avatar.png",       title:"温柔耐心" },
  hu:   { name:"琥珀",   avatar:"assets/avatars/characters/hu-po-avatar.png",        title:"符纸保养" },
  tong: { name:"佟装水", avatar:"assets/avatars/characters/tong-xiao-yu-avatar.png", title:"新人画符" },
  qing: { name:"青龙",   avatar:"assets/avatars/characters/qing-long-avatar.png",    title:"巡街路线" },
  bai:  { name:"白虎",   avatar:"assets/avatars/characters/bai-hu-avatar.png",       title:"直球" },
  zhu:  { name:"朱雀",   avatar:"assets/avatars/characters/zhu-que-avatar.png",      title:"火符" },
  xuan: { name:"玄武",   avatar:"assets/avatars/characters/xuan-wu-avatar.png",      title:"守阵" }
};

const NPCS = {
  fu:    { name:"符纸收藏家" },
  hong:  { name:"红线不缠我" },
  bi:    { name:"笔仙退散" },
  ye:    { name:"夜巡小队长" },
  du:    { name:"秦大侠的读档记录" },
  luoFan:{ name:"双面鬼毒舌翻译机" },
  map:   { name:"大地图迷路中" },
  fish:  { name:"水区摸鱼怪" }
};

const BOARDS = [
  { id:"general",  name:"捉鬼杂谈",     desc:"新人求助 · 经验交流 · 避坑" },
  { id:"characters",name:"角色专区",    desc:"八位角色相关的捉鬼讨论" },
  { id:"events",   name:"灵异事件记录", desc:"笔仙复盘 · 巡街记录 · 异常现象" },
  { id:"practice", name:"捉鬼实务",     desc:"符咒 · 朱砂 · 道具 · 大地图" },
  { id:"notes",    name:"捉鬼手记",     desc:"符样 · 手记 · 脑洞记录" },
  { id:"lounge",   name:"捉鬼师摸鱼区", desc:"任务吐槽 · 装备保养 · 巡街闲聊" }
];

const POSTS = [
  {
    id:1, board:"general", title:"新人报到：第一次巡夜需要准备什么？",
    author:"map", authorType:"npc", tags:["新人","巡夜"], time:"2026-10-18 21:10", likes:16, views:322,
    content:"刚入行，今晚第一次跟队巡夜。除了符纸和朱砂，还需要带什么？手电算不算违规？在线等。",
    replies:[
      { author:"ye", authorType:"npc", content:"手电可以，别用强光直照墙角。带一小包干糯米，湿气重的地方撒一点。", likes:8 },
      { author:"fu", authorType:"npc", content:"符纸别揣裤兜，折痕会影响贴合。用硬纸板夹着。", likes:5 },
      { author:"bi", authorType:"npc", content:"记得带水。别问，问就是上次喊到嗓子哑。", likes:3 }
    ]
  },
  {
    id:2, board:"general", title:"符纸总贴反怎么办，在线等，挺急的",
    author:"bi", authorType:"npc", tags:["符纸","求助"], time:"2026-10-18 22:40", likes:9, views:188,
    content:"连续三张，贴上去就掉。我怀疑不是符的问题，是我手的问题。有没有同样手残的。",
    replies:[
      { author:"fu", authorType:"npc", content:"先看墙面。返潮的墙贴什么都掉，烘一遍再贴。", likes:6 },
      { author:"ye", authorType:"npc", content:"也可能是你贴反了。朱砂面朝外，别对着墙。", likes:4 }
    ]
  },
  {
    id:3, board:"general", title:"旧城区夜巡避坑记录（持续更新）",
    author:"ye", authorType:"npc", tags:["旧城区","避坑","巡夜"], time:"2026-10-17 23:05", likes:21, views:410,
    content:"旧城区三巷、五巷、老粮站后墙，这三处湿气最重，符纸基本撑不过半刻。建议白天踩点，晚上结伴。",
    replies:[
      { author:"map", authorType:"npc", content:"三巷我上周也去了，确实。墙皮一碰就掉。", likes:3 },
      { author:"fu", authorType:"npc", content:"那边建议用干性朱砂，普通的不行。", likes:7 },
      { author:"qin", authorType:"character", content:"谢谢整理。我这边也记一下，旧城区确实要多留一份心。", likes:12 }
    ]
  },
  {
    id:4, board:"general", title:"朱砂受潮了还能用吗？",
    author:"fu", authorType:"npc", tags:["朱砂","材料"], time:"2026-10-17 19:20", likes:11, views:240,
    content:"一盒朱砂放窗边忘了收，结块了。磨碎还能不能用？还是直接换新的。",
    replies:[
      { author:"ye", authorType:"npc", content:"结块别硬磨，画出来会断线。应急可以，正经出任务换新的。", likes:5 },
      { author:"hu", authorType:"character", content:"受潮的朱砂可以摊开阴干，别晒。晒过之后颜色会发暗，效果差一截。", likes:9 }
    ]
  },
  {
    id:5, board:"general", title:"遇到符纸自燃是先跑还是先灭火？",
    author:"fish", authorType:"npc", tags:["符纸","应急"], time:"2026-10-16 22:12", likes:14, views:301,
    content:"昨晚贴的符突然自己烧起来了，我愣了三秒。正确流程到底是什么？",
    replies:[
      { author:"ye", authorType:"npc", content:"先退两步，看火势和方向。自燃多半是那边有东西，别急着伸手。", likes:8 },
      { author:"bi", authorType:"npc", content:"我上次直接一盆水，然后被队长骂了半小时。", likes:4 }
    ]
  },
  {
    id:6, board:"general", title:"求推荐靠谱的罗盘，别太贵",
    author:"hong", authorType:"npc", tags:["罗盘","道具"], time:"2026-10-16 18:44", likes:7, views:166,
    content:"新手用，预算不高。主要想判断方向，不要求多精准。二手能收吗？",
    replies:[
      { author:"fu", authorType:"npc", content:"二手先看磁针晃不晃，晃得厉害就别要。", likes:4 },
      { author:"qing", authorType:"character", content:"新手其实不用急着上罗盘，先把巡街路线记熟。方向感比工具重要。", likes:10 }
    ]
  },

  {

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function loadState(){
  state.user = loadJSON(LS.user, null);
  state.likes = loadJSON(LS.likes, {});
  state.favs = loadJSON(LS.favs, {});
  state.userReplies = loadJSON(LS.replies, {});
  state.notifications = loadJSON(LS.notifs, [
    { id:1, text:"夜巡小队长 回复了你的帖子《新人报到：第一次巡夜需要准备什么？》", time:"10 分钟前", read:false },
    { id:2, text:"符纸收藏家 赞了你的回复", time:"1 小时前", read:false }
  ]);
}
loadState();

function persistUser(){ saveJSON(LS.user, state.user); }
function persistLikes(){ saveJSON(LS.likes, state.likes); }
function persistFavs(){ saveJSON(LS.favs, state.favs); }
function persistReplies(){ saveJSON(LS.replies, state.userReplies); }
function persistNotifs(){ saveJSON(LS.notifs, state.notifications); }

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]
  ));
}
function person(key, type){
  if(type === "character"){
    const c = CHARACTERS[key] || { name:"未知角色", avatar:DEFAULT_NPC_AVATAR, title:"" };
    return { name:c.name, avatar:c.avatar, title:c.title, type:"character" };
  }
  const n = NPCS[key] || { name:"匿名坛友" };
  return { name:n.name, avatar:DEFAULT_NPC_AVATAR, title:"普通坛友", type:"npc" };
}
function postById(id){ return POSTS.find(p => p.id === Number(id)); }
function boardById(id){ return BOARDS.find(b => b.id === id); }
function unreadCount(){ return state.notifications.filter(n => !n.read).length; }
function isLoggedIn(){ return !!state.user; }

window.imgFallback = function(el, type){
  if(type === "avatar"){
    el.onerror = null;
    el.src = DEFAULT_NPC_AVATAR;
  }else{
    const box = el.parentElement;
    if(box) box.classList.add("missing");
    el.style.display = "none";
  }
};

function avatarHTML(p, cls){
  const c = cls || "avatar"
